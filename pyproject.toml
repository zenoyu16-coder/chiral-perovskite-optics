[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chiral-perovskite-optics"
version = "0.1.0"
description = "Reproducible structure-first exploration of chiral 2D hybrid perovskites"
requires-python = ">=3.10"
dependencies = ["pymatgen>=2024.1", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
viz = ["matplotlib>=3.7"]

[project.scripts]
chiral-pv = "chiral_perovskites.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
